# Daily exam dates refresh: reads the sites named in the Exams sheet and commits raah-dataset.xlsx when a date changed.
# Same job the server runs every RAAH_REFRESH_INTERVAL_HOURS; this copy keeps the file in the repo current too.
name: Refresh exam dates

on:
  schedule:
    - cron: "30 1 * * *"   # 07:00 IST every day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-exam-dates
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Read the exam sites and update the sheet
        id: refresh
        working-directory: backend
        env:
          DISABLE_SQLALCHEMY_CEXT_RUNTIME: "1"
        run: |
          python -m raah.exam_refresh --write --no-model --json > ../refresh.json
          python -c "import json; d = json.load(open('../refresh.json')); print('changed=%d' % len(d['changes']))" >> "$GITHUB_OUTPUT"
          python -c "import json; [print(c['exam'], c['field'], c['old'] or '-', '->', c['new']) for c in json.load(open('../refresh.json'))['changes']]"
      - name: Commit the new dates
        if: steps.refresh.outputs.changed != '0'
        run: |
          git config user.name "raah-dates-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raah-dataset.xlsx
          git commit -m "Exam dates: ${{ steps.refresh.outputs.changed }} date(s) refreshed from official sites"
          git push
