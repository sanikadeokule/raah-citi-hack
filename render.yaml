# Render Blueprint: one web service (FastAPI serving the built web/out) and a PostgreSQL database.
# Secrets are marked sync: false, so Render asks for them in its dashboard and they never go in git.
databases:
  - name: raah-db
    plan: free
    databaseName: raah
    user: raah

services:
  - type: web
    name: raah
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn raah.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/version
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: raah-db
          property: connectionString
      - key: RAAH_SIGNING_KEY
        generateValue: true
      - key: RAAH_MCP_TRANSPORT
        value: memory  # run the MCP servers inside the app, not as extra processes (512 MB limit)
      - key: LLM_PROVIDERS
        value: groq,openai
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SARVAM_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
